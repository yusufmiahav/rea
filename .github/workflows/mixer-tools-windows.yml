name: Mixer Tools Windows exe

on:
  push:
    branches: [claude/project-thread-cs87jc]
    paths: ["mixer-tools/**", ".github/workflows/mixer-tools-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mixer-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install numpy==2.1.3 sounddevice==0.5.1 pyinstaller==6.11.1
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name MixerTools
          --hidden-import desktools.qu16_probe --hidden-import desktools.dm7_rcp_probe
          --hidden-import feedback_suppressor --collect-all sounddevice
          feedback_gui.py
      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $env:SELFTEST_OUT = "$PWD\selftest.txt"
          Start-Process -FilePath dist\MixerTools.exe -ArgumentList "--selftest" -Wait
          Get-Content selftest.txt
          if ((Get-Content selftest.txt) -ne "OK") { exit 1 }
          $env:SELFTEST_OUT = "$PWD\smoke.txt"
          Start-Process -FilePath dist\MixerTools.exe -ArgumentList "--smoke-gui" -Wait
          Get-Content smoke.txt
          if ((Get-Content smoke.txt) -ne "OK") { exit 1 }
          $env:FS_TOOL_OUT = "$PWD\tool.txt"
          Start-Process -FilePath dist\MixerTools.exe -ArgumentList "--tool","feedback","notch","--desk","qu","--target","Ip1","--band","2","--freq","2500" -Wait
          Get-Content tool.txt
          if (-not (Select-String -Path tool.txt -Pattern "qu dry-run")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: MixerTools-windows
          path: mixer-tools/dist/MixerTools.exe
