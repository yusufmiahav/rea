name: Mixer Tools Windows exe

on:
  push:
    branches: [claude/project-thread-cs87jc]
    paths: ["mixer-tools/**", ".github/workflows/mixer-tools-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mixer-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install numpy==2.1.3 sounddevice==0.5.1 pyinstaller==6.11.1
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build exe (window app and console build for diagnostics / command line)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name MixerTools --hidden-import desktools.qu16_probe --hidden-import desktools.dm7_rcp_probe --hidden-import feedback_suppressor --collect-all sounddevice feedback_gui.py
          pyinstaller --noconfirm --onefile --console --name MixerTools-console --hidden-import desktools.qu16_probe --hidden-import desktools.dm7_rcp_probe --hidden-import feedback_suppressor --collect-all sounddevice feedback_gui.py
      - name: Self-test (console build, prints errors)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:SELFTEST_OUT = "$PWD\selftest.txt"
          dist\MixerTools-console.exe --selftest
          Get-Content selftest.txt
          dist\MixerTools-console.exe --tool feedback notch --desk qu --target Ip1 --band 2 --freq 2500
          dist\MixerTools-console.exe --tool dm7 get --help
          $env:SELFTEST_OUT = "$PWD\smoke0.txt"
          $p = Start-Process -FilePath dist\MixerTools-console.exe -ArgumentList "--smoke-gui" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host "console smoke timed out" }
          if (Test-Path smoke0.txt) { Get-Content smoke0.txt }
      - name: Self-test (window build)
        timeout-minutes: 3
        shell: pwsh
        run: |
          function Run-Exe($exeArgs, $out) {
            $env:SELFTEST_OUT = $out
            $p = Start-Process -FilePath dist\MixerTools.exe -ArgumentList $exeArgs -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host "timed out: $exeArgs"; exit 1 }
            Get-Content $out
            if ((Get-Content $out) -ne "OK") { exit 1 }
          }
          Run-Exe "--selftest" "$PWD\selftest2.txt"
          Run-Exe "--smoke-gui" "$PWD\smoke.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: MixerTools-windows
          path: |
            mixer-tools/dist/MixerTools.exe
            mixer-tools/dist/MixerTools-console.exe
