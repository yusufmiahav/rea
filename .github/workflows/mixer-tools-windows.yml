name: Mixer Tools Windows exe

on:
  push:
    branches: [claude/project-thread-cs87jc, claude/project-thread-3gz9ma]
    paths: ["mixer-tools/**", ".github/workflows/mixer-tools-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mixer-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install numpy==2.1.3 sounddevice==0.5.1 pyinstaller==6.11.1 sv-ttk==2.6.0
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build exe (window app and console build for diagnostics / command line)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name MixerTools --hidden-import desktools.qu16_probe --hidden-import desktools.dm7_rcp_probe --hidden-import feedback_suppressor --collect-all sounddevice --collect-data sv_ttk --hidden-import sv_ttk feedback_gui.py
          pyinstaller --noconfirm --onefile --console --name MixerTools-console --hidden-import desktools.qu16_probe --hidden-import desktools.dm7_rcp_probe --hidden-import feedback_suppressor --collect-all sounddevice --collect-data sv_ttk --hidden-import sv_ttk feedback_gui.py
      - name: Self-test (console build, prints errors)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:SELFTEST_OUT = "$PWD\selftest.txt"
          dist\MixerTools-console.exe --selftest
          Get-Content selftest.txt
          dist\MixerTools-console.exe --tool feedback notch --desk qu --target Ip1 --band 2 --freq 2500
          dist\MixerTools-console.exe --tool dm7 get --help
          $env:SELFTEST_OUT = "$PWD\smoke0.txt"
          $p = Start-Process -FilePath dist\MixerTools-console.exe -ArgumentList "--smoke-gui" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host "console smoke timed out" }
          if (Test-Path smoke0.txt) { Get-Content smoke0.txt }
      - name: Self-test (window build)
        timeout-minutes: 3
        shell: pwsh
        run: |
          function Run-Exe($exeArgs, $out) {
            $env:SELFTEST_OUT = $out
            $p = Start-Process -FilePath dist\MixerTools.exe -ArgumentList $exeArgs -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host "timed out: $exeArgs"; exit 1 }
            Get-Content $out
            if ((Get-Content $out) -ne "OK") { exit 1 }
          }
          Run-Exe "--selftest" "$PWD\selftest2.txt"
          Run-Exe "--smoke-gui" "$PWD\smoke.txt"
      - name: Screenshots of the window
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:SELFTEST_OUT = "$PWD\smoke3.txt"
          $p = Start-Process -FilePath dist\MixerTools.exe -ArgumentList "--smoke-gui" -PassThru
          Start-Sleep -Seconds 3; Shot "1-feedback"
          Start-Sleep -Seconds 3; Shot "2-mixer"
          $p.WaitForExit(30000) | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: mixer-tools/shots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: MixerTools-windows
          path: |
            mixer-tools/dist/MixerTools.exe
            mixer-tools/dist/MixerTools-console.exe
